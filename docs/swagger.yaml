basePath: /api/v1
definitions:
  github_com_farrasnazhif_ripple-be_internal_dto_request.DirectImage:
    properties:
      expected_version:
        type: integer
      request_key:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_dto_request.FinalRefinement:
    properties:
      image_index:
        type: integer
      prompt:
        type: string
      reason:
        type: string
      request_key:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_dto_request.FinalRegeneration:
    properties:
      image_index:
        type: integer
      request_key:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_dto_request.Login:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_farrasnazhif_ripple-be_internal_dto_request.ProjectBudget:
    properties:
      limit_cents:
        type: integer
    type: object
  github_com_farrasnazhif_ripple-be_internal_dto_request.ProjectCreate:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_dto_request.Register:
    properties:
      email:
        maxLength: 225
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 100
        type: string
    required:
    - email
    - password
    - username
    type: object
  github_com_farrasnazhif_ripple-be_internal_dto_response.User:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      username:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_dto_response.UserWithToken:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      token:
        type: string
      username:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_entity.FinalOutput:
    properties:
      accepted:
        type: boolean
      brief_version:
        type: integer
      created_at:
        type: string
      download_url:
        type: string
      id:
        type: string
      image_index:
        type: integer
      job_ids:
        items:
          type: string
        type: array
      kind:
        type: string
      outputs:
        items:
          type: string
        type: array
      parent_id:
        type: string
      prompt:
        type: string
      reason:
        type: string
      request_key:
        type: string
      status:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_entity.GenerationRates:
    additionalProperties:
      format: int64
      type: integer
    type: object
  github_com_farrasnazhif_ripple-be_internal_entity.GenerationUsage:
    properties:
      actor:
        type: string
      created_at:
        type: string
      description:
        type: string
      estimate_cents:
        type: integer
      operation:
        type: string
      operation_id:
        type: string
      state:
        type: string
      status:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_entity.Project:
    properties:
      brief_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  github_com_farrasnazhif_ripple-be_internal_entity.ProjectBudget:
    properties:
      available_cents:
        type: integer
      limit_cents:
        type: integer
      rates:
        $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.GenerationRates'
      reserved_cents:
        type: integer
      spent_cents:
        type: integer
      usage:
        items:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.GenerationUsage'
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: User authentication, profile management, and creative brief API
  title: Ripple API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password, returns JWT token
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_request.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_response.UserWithToken'
        "400":
          description: Bad Request
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create an active account and return a JWT token
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_request.Register'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_response.UserWithToken'
        "400":
          description: Bad Request
      summary: Register a new user
      tags:
      - auth
  /projects:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.Project'
            type: array
      security:
      - BearerAuth: []
      summary: List owned projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project name and optional description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_request.ProjectCreate'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.Project'
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - projects
  /projects/{projectID}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Permanently delete an owned project and its workflow
      tags:
      - projects
    get:
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.Project'
      security:
      - BearerAuth: []
      summary: Get an owned project
      tags:
      - projects
    patch:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      - description: Updated project title and description
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_request.ProjectCreate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.Project'
      security:
      - BearerAuth: []
      summary: Update project title and description
      tags:
      - projects
  /projects/{projectID}/budget:
    get:
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.ProjectBudget'
      security:
      - BearerAuth: []
      summary: Get the project media budget, estimates and latest 100 usage entries
      tags:
      - projects
    put:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      - description: Budget limit
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_request.ProjectBudget'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.ProjectBudget'
      security:
      - BearerAuth: []
      summary: Set the owned project's media budget cap in USD cents
      tags:
      - projects
  /projects/{projectID}/finals/{finalID}:
    get:
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      - description: Final output ID
        in: path
        name: finalID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.FinalOutput'
      security:
      - BearerAuth: []
      summary: Get a final output and reconcile its generation status
      tags:
      - projects
  /projects/{projectID}/finals/{finalID}/accept:
    post:
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      - description: Final output ID
        in: path
        name: finalID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.FinalOutput'
      security:
      - BearerAuth: []
      summary: Accept a completed final output version
      tags:
      - projects
  /projects/{projectID}/finals/{finalID}/refinements:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      - description: Source final output ID
        in: path
        name: finalID
        required: true
        type: string
      - description: Refinement instructions and idempotency key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_request.FinalRefinement'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.FinalOutput'
      security:
      - BearerAuth: []
      summary: Refine a saved final image or video using it as a reference
      tags:
      - projects
  /projects/{projectID}/finals/{finalID}/regenerations:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      - description: Saved final output ID
        in: path
        name: finalID
        required: true
        type: string
      - description: Image index and idempotency key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_request.FinalRegeneration'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.FinalOutput'
      security:
      - BearerAuth: []
      summary: Generate another iteration using the saved prompt and original reference
      tags:
      - projects
  /projects/{projectID}/images:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: projectID
        required: true
        type: string
      - description: Saved brief version and idempotency key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_request.DirectImage'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_entity.FinalOutput'
      security:
      - BearerAuth: []
      summary: Generate a final image directly from the saved brief summary
      tags:
      - projects
  /users/me:
    get:
      description: Get the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_farrasnazhif_ripple-be_internal_dto_response.User'
        "401":
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Bearer token (e.g. "Bearer xxx")
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
